name: desktop - Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri application
        run: npm run tauri -- build -- --verbose

      - name: Collect installer and version metadata
        id: metadata
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p build-assets
          echo "$VERSION" > build-assets/version.txt
          find src-tauri/target/release/bundle/nsis -name "*.exe" -exec cp {} build-assets/ \;

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: asset-library-windows-v${{ steps.metadata.outputs.version }}
          path: build-assets/
          if-no-files-found: error
          retention-days: 14
